name: 15_beat_lstm
data_root: data/raw
preprocess: configs/preprocess/default.yaml
preprocess_overrides:
  augment:
    enabled: false
representation:
  type: beat_sequence
  sampling_rate: 300
  beat_seconds: 0.6
  pre_seconds: 0.25
  max_beats: 192
  beat_augment:
    beat_length: 180
    noise_std: 0.05
split:
  seed: 42
  test_size: 0.2
  n_folds: 5
model:
  name: beat_lstm
  beat_length: 180
  hidden: 128
  dropout: 0.3
train:
  epochs: 100
  batch_size: 16
  lr: 0.001
  min_lr: 0.000001
  patience: 20
  weight_decay: 0.0001
  num_workers: 0
  scheduler: cosine
  score_test: fold_ensemble
