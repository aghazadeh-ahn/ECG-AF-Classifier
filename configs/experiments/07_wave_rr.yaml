name: 07_wave_rr
data_root: data/raw
preprocess: configs/preprocess/default.yaml
split:
  seed: 42
  test_size: 0.2
  n_folds: 5
model:
  name: dilated_resnet_rr
  channels: [16, 32, 64, 128]
  dilations: [1, 2, 4, 8]
  dropout: 0.2
  use_rr: true
  rr_dim: 16
  rr_hidden: 32
train:
  epochs: 25
  batch_size: 16
  lr: 0.001
  patience: 5
  weight_decay: 0.0001
  num_workers: 0
