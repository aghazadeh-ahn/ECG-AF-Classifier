name: 17_mean_max_pool
data_root: data/raw
preprocess: configs/preprocess/default.yaml
preprocess_overrides:
  augment:
    scale_min: 0.7
    scale_max: 1.3
    noise_std: 0.05
    warp_min: 0.9
    warp_max: 1.1
    wander_hz_min: 0.05
    wander_hz_max: 0.5
    wander_amp: 0.3
    cutout_seconds: 1.5
split:
  seed: 42
  test_size: 0.2
  n_folds: 5
model:
  name: dilated_resnet
  channels: [16, 32, 64, 128]
  dilations: [1, 2, 4, 8]
  dropout: 0.2
  pooling: mean_max
train:
  epochs: 100
  batch_size: 16
  lr: 0.001
  min_lr: 0.000001
  patience: 20
  weight_decay: 0.0001
  num_workers: 0
  scheduler: cosine
  score_test: fold_ensemble
