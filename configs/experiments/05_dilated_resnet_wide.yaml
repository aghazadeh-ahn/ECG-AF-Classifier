name: 05_dilated_resnet_wide
data_root: data/raw
preprocess: configs/preprocess/default.yaml
split:
  seed: 42
  test_size: 0.2
  n_folds: 5
model:
  name: dilated_resnet
  channels: [32, 64, 128, 256, 256]
  dilations: [1, 2, 4, 8, 16]
  dropout: 0.25
train:
  epochs: 40
  batch_size: 8
  lr: 0.001
  patience: 8
  weight_decay: 0.0001
  num_workers: 0
