name: 14_log_spectrogram
data_root: data/raw
preprocess: configs/preprocess/default.yaml
preprocess_overrides:
  augment:
    enabled: false
representation:
  type: log_spectrogram
  n_fft: 128
  hop_length: 64
  spec_augment:
    freq_masks: 2
    max_freq_bins: 8
    time_masks: 2
    max_time_frames: 24
split:
  seed: 42
  test_size: 0.2
  n_folds: 5
model:
  name: spec_resnet
  channels: [16, 32, 64, 128]
  dilations: [1, 2, 4, 8]
  dropout: 0.2
train:
  epochs: 100
  batch_size: 16
  lr: 0.001
  min_lr: 0.000001
  patience: 20
  weight_decay: 0.0001
  num_workers: 0
  scheduler: cosine
  score_test: fold_ensemble
