name: 09_dilated_transformer
data_root: data/raw
preprocess: configs/preprocess/default.yaml
split:
  seed: 42
  test_size: 0.2
  n_folds: 5
model:
  name: dilated_resnet_transformer
  channels: [16, 32, 64, 128]
  dilations: [1, 2, 4, 8]
  dropout: 0.2
  transformer_heads: 4
  transformer_layers: 2
  transformer_ff: 256
train:
  epochs: 25
  batch_size: 8
  lr: 0.001
  patience: 5
  weight_decay: 0.0001
  num_workers: 0
