name: 10_long_cosine
data_root: data/raw
preprocess: configs/preprocess/default.yaml
split:
  seed: 42
  test_size: 0.2
  n_folds: 5
model:
  name: dilated_resnet
  channels: [16, 32, 64, 128]
  dilations: [1, 2, 4, 8]
  dropout: 0.2
train:
  epochs: 100
  batch_size: 16
  lr: 0.001
  min_lr: 0.000001
  patience: 20
  weight_decay: 0.0001
  num_workers: 0
  scheduler: cosine
  score_test: fold_ensemble
